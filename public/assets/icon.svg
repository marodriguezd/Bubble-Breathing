<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a7d7a"/>
      <stop offset="100%" stop-color="#1e403f"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0f7f6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Maskable background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Hexagon outline (matches app aesthetic) -->
  <polygon points="256,106 386,181 386,331 256,406 126,331 126,181" 
           fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="16" stroke-linejoin="round"/>
           
  <!-- Inner breathing bubble with glow -->
  <circle cx="256" cy="256" r="95" fill="url(#bubble)" filter="url(#glow)"/>
  <circle cx="290" cy="220" r="25" fill="#ffffff" opacity="0.5" filter="url(#glow)"/>
</svg>